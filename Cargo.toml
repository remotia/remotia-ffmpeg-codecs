[package]
name = "remotia-ffmpeg-codecs"
version = "0.1.0"
edition = "2021"

[dependencies.tokio]
version = "1.28.2"
features = ["rt", "rt-multi-thread", "macros", "net"]

[dependencies.remotia]
# version = "0.1.3"
path = "../remotia/crates/remotia"
default-features = false
features = ["buffers", "render"]

[dev-dependencies.remotia]
path = "../remotia/crates/remotia"
default-features = false
features = ["buffers", "render", "capture"]

[dependencies]
rsmpeg = { version = "0.16.1", default-features = false }
env_logger = "0.10.0"
log = "0.4.14"
async-trait = "0.1.68"
clap = { version = "4.3.2", features = ["derive"] }
cstr = "0.2.11"
